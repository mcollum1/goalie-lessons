<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1a30">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>On-ice · Goalie Coach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --gc-navy:        #1c3150;
    --gc-navy-dk:     #0c1a30;
    --gc-navy-2:      #243d63;
    --phase-skating:  #18a6c8;
    --phase-shot:     #e05c2a;
    --phase-skill:    #378ADD;
    --phase-compete:  #17a064;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gc-navy-dk);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    height: 100%;
    overflow: hidden; /* no scrolling — everything fits the viewport */
  }

  body {
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  .app {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--gc-navy-dk);
    position: relative;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: env(safe-area-inset-top) 12px 0;
    padding-top: calc(env(safe-area-inset-top) + 10px);
    padding-bottom: 10px;
    background: rgba(12,26,48,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
    z-index: 10;
  }

  .btn-back {
    height: 40px;
    padding: 0 12px 0 8px;
    border-radius: 20px;
    border: none;
    background: rgba(255,255,255,0.09);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s ease;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .btn-back:hover  { background: rgba(255,255,255,0.15); }
  .btn-back:active { background: rgba(255,255,255,0.22); }
  .btn-back svg    { width: 18px; height: 18px; }

  .top-center {
    flex: 1;
    min-width: 0;
    text-align: center;
  }

  .drill-counter {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .session-label {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .timer-display {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 7px 12px;
    flex-shrink: 0;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: background 0.15s ease;
  }

  .timer-display:hover  { background: rgba(255,255,255,0.13); }
  .timer-display.running { color: rgba(255,255,255,0.85); }

  /* ── Progress bar ── */
  .progress-track {
    height: 3px;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .progress-fill {
    height: 100%;
    background: var(--gc-navy-2);
    transition: width 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* ── Drill stage — main scrollable area ── */
  .drill-stage {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    /* swipe hint — touch-action pan-y blocks horizontal drag on iOS unless we handle it */
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Phase pill ── */
  .phase-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 auto 12px;
    flex-shrink: 0;
  }

  .phase-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Video block ── */
  .video-block {
    background: #060d18;
    width: 100%;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .video-download-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fff;
    opacity: 0.75;
    transition: opacity 0.15s;
    z-index: 10;
    text-decoration: none;
  }
  .video-download-btn:hover,
  .video-download-btn:active { opacity: 1; }
  .video-download-btn svg { width: 17px; height: 17px; }

  .video-block video {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    display: block;
  }

  .no-clip-placeholder {
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    background: #060d18;
    color: rgba(255,255,255,0.25);
  }

  .no-clip-placeholder svg { width: 28px; height: 28px; }
  .no-clip-placeholder span { font-size: 12px; font-weight: 500; letter-spacing: 0.02em; }

  /* ── Drill info ── */
  .drill-info {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .drill-name-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .drill-name {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.02em;
    flex: 1;
    min-width: 0;
  }

  .drill-badges {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.7);
  }

  /* ── Coaching cues ── */
  .cues-label {
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: -4px;
  }

  .cues {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cue {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    line-height: 1.45;
  }

  .cue-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* ── Description ── */
  .drill-desc {
    font-size: 13.5px;
    color: rgba(255,255,255,0.5);
    line-height: 1.55;
    padding: 10px 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    border-left: 2px solid rgba(255,255,255,0.12);
  }

  /* ── Swipe hint ── */
  .swipe-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 0 0;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.04em;
  }

  .swipe-hint svg { width: 14px; height: 14px; opacity: 0.4; }

  /* ── Bottom action bar ── */
  .action-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: rgba(12,26,48,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }

  .btn-prev {
    width: 50px;
    height: 54px;
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }

  .btn-prev:hover  { background: rgba(255,255,255,0.12); }
  .btn-prev:active { background: rgba(255,255,255,0.18); }
  .btn-prev:disabled { opacity: 0.25; cursor: default; }
  .btn-prev svg { width: 22px; height: 22px; }

  .btn-next {
    flex: 1;
    height: 54px;
    border-radius: 14px;
    border: none;
    background: #fff;
    color: var(--gc-navy);
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
    box-shadow: 0 2px 16px rgba(255,255,255,0.12);
  }

  .btn-next:hover  { background: rgba(255,255,255,0.92); }
  .btn-next:active { transform: scale(0.98); }
  .btn-next svg    { width: 18px; height: 18px; flex-shrink: 0; }
  .btn-next.is-last { background: #17a064; color: #fff; box-shadow: 0 2px 16px rgba(23,160,100,0.3); }
  .btn-next.is-last:hover { background: #14915a; }

  /* ── No plan fallback ── */
  .no-plan {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    gap: 14px;
  }

  .no-plan-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.45);
    margin-bottom: 6px;
  }

  .no-plan-icon svg { width: 26px; height: 26px; }
  .no-plan h2 { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
  .no-plan p  { font-size: 13.5px; color: rgba(255,255,255,0.5); line-height: 1.5; max-width: 260px; }
  .no-plan a  { color: rgba(255,255,255,0.7); font-weight: 600; font-size: 14px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 1px; }

  /* ── Slide transition ── */
  .drill-stage .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
    background: var(--gc-navy-dk);
  }

  .drill-stage .slide.slide-active  { transform: translateX(0); }
  .drill-stage .slide.slide-left    { transform: translateX(-100%); }
  .drill-stage .slide.slide-right   { transform: translateX(100%); }

  .drill-stage .slide.slide-enter-from-right { transform: translateX(100%); }
  .drill-stage .slide.slide-enter-from-left  { transform: translateX(-100%); }

  /* ── Completion overlay ── */
  .completion-overlay {
    position: absolute;
    inset: 0;
    background: rgba(12,26,48,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 48px 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 50;
  }

  .completion-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .completion-check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(23,160,100,0.18);
    border: 2px solid rgba(23,160,100,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #17a064;
    margin-bottom: 8px;
  }

  .completion-check svg { width: 30px; height: 30px; }
  .completion-title { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
  .completion-sub   { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.5; max-width: 260px; }

  .completion-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 300px;
    margin-top: 8px;
  }

  .completion-btn {
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }

  .completion-btn:active { transform: scale(0.98); }

  .completion-btn.primary {
    background: #fff;
    color: var(--gc-navy);
  }

  .completion-btn.primary:hover { background: rgba(255,255,255,0.9); }

  .completion-btn.ghost {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    border: 1.5px solid rgba(255,255,255,0.12);
    font-weight: 600;
  }

  .completion-btn.ghost:hover { background: rgba(255,255,255,0.14); }

  /* ── Record button (floats in video-block) ── */
  .record-btn {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(220,38,38,0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fff;
    z-index: 10;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .record-btn:hover  { background: rgba(220,38,38,1); }
  .record-btn:active { transform: scale(0.92); }
  .record-btn svg    { width: 17px; height: 17px; }
  .record-btn.recording { background: rgba(220,38,38,1); }

  .rec-indicator {
    position: absolute;
    top: 10px;
    left: 10px;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.62);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 5px 10px;
    font-size: 11.5px;
    font-weight: 700;
    color: #fff;
    pointer-events: none;
    z-index: 11;
  }
  .rec-indicator.visible { display: flex; }
  .rec-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ef4444;
    animation: rec-blink 1s ease infinite;
  }
  @keyframes rec-blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

  /* ── Recording playback panel ── */
  .rec-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .rec-overlay.visible { opacity: 1; pointer-events: auto; }

  .rec-panel {
    background: #0c1a30;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .rec-panel-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }
  .rec-panel-hdr-text { flex: 1; }
  .rec-panel-title   { font-size: 15px; font-weight: 700; color: #fff; }
  .rec-panel-sub     { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }

  .rec-close {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .rec-close svg { width: 15px; height: 15px; }

  .rec-video-wrap { background: #000; width: 100%; flex-shrink: 0; }
  .rec-video-wrap video { width: 100%; max-height: 280px; display: block; object-fit: contain; }

  .rec-controls { padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }

  .rec-scrub-row { display: flex; align-items: center; gap: 10px; }
  .rec-scrub {
    flex: 1; height: 4px; -webkit-appearance: none;
    background: rgba(255,255,255,0.15); border-radius: 4px; cursor: pointer; outline: none;
  }
  .rec-scrub::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; margin-top: -5px;
  }
  .rec-time { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); min-width: 36px; font-variant-numeric: tabular-nums; }

  .rec-btn-row { display: flex; align-items: center; gap: 9px; }
  .rec-play {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.11); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: background 0.12s;
  }
  .rec-play:hover { background: rgba(255,255,255,0.2); }
  .rec-play svg   { width: 18px; height: 18px; }

  .rec-speeds { display: flex; gap: 6px; }
  .rec-spd {
    padding: 6px 11px; border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.14);
    background: transparent; color: rgba(255,255,255,0.55);
    font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: all 0.12s;
  }
  .rec-spd.on { background: rgba(255,255,255,0.13); color: #fff; border-color: rgba(255,255,255,0.3); }

  .rec-action-row { display: flex; gap: 8px; padding: 0 16px 14px; flex-shrink: 0; }
  .rec-save {
    flex: 1; padding: 12px; border-radius: 12px; border: none;
    background: #17a064; color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: background 0.12s;
  }
  .rec-save:hover { background: #14915a; }
  .rec-annotate {
    padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.14);
    background: transparent; color: rgba(255,255,255,0.72);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; white-space: nowrap; transition: background 0.12s;
  }
  .rec-annotate:hover { background: rgba(255,255,255,0.07); }

  .rec-ann-list {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 10px 16px 14px;
    display: flex; flex-direction: column; gap: 7px;
    max-height: 130px; overflow-y: auto;
  }
  .rec-ann-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.4; }
  .rec-ann-ts   { font-weight: 700; color: #18a6c8; white-space: nowrap; min-width: 38px; }

  /* ── Session note (completion overlay) ── */
  .sn-area {
    width: 100%; max-width: 300px;
    display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
  }
  .sn-label {
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.32);
    text-transform: uppercase; letter-spacing: 0.08em; text-align: left;
  }
  .sn-input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 12px; color: #fff;
    font-size: 13px; font-family: inherit; line-height: 1.45;
    padding: 10px 12px; resize: none; outline: none; min-height: 68px;
  }
  .sn-input::placeholder { color: rgba(255,255,255,0.28); }
  .sn-input:focus { border-color: rgba(255,255,255,0.26); }
  .sn-save {
    width: 100%; padding: 11px; border-radius: 11px; border: none;
    background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.75);
    font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: background 0.12s;
  }
  .sn-save:hover { background: rgba(255,255,255,0.15); }
  .sn-save.saved { background: rgba(23,160,100,0.22); color: #4ade80; }
  .export-ann-btn {
    width: 100%; padding: 10px; border-radius: 11px;
    border: 1.5px solid rgba(255,255,255,0.09);
    background: transparent; color: rgba(255,255,255,0.38);
    font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.12s;
    display: none;
  }
  .export-ann-btn.visible { display: block; }
  .export-ann-btn:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); }

  /* ─── Tablet / iPad responsive ─── */
  @media (min-width: 768px) {
    .app { max-width: 680px; border-radius: 0; }

    /* Header */
    .session-header { padding: 0 24px; }
    .session-title { font-size: 17px; }

    /* Drill card — more breathing room */
    .drill-card { padding: 24px 24px 28px; }
    .drill-card-name { font-size: 22px; }
    .drill-card-phase { font-size: 13px; }

    /* Video */
    .video-block video { max-height: 420px; }

    /* Progress dots */
    .progress-dots { gap: 8px; }

    /* Swipe controls */
    .swipe-controls { padding: 0 24px 20px; gap: 16px; }
    .btn-prev, .btn-next { width: 52px; height: 52px; }
    .btn-complete { height: 52px; font-size: 16px; border-radius: 14px; }

    /* Timer */
    .timer-display { font-size: 44px; }
  }

  @media (min-width: 1024px) {
    .app { max-width: 760px; }
    .drill-card-name { font-size: 24px; }
    .video-block video { max-height: 480px; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- Top bar -->
  <header class="top-bar" id="topBar">
    <button class="btn-back" type="button" id="btnBack" aria-label="Back to plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </svg>
      Plan
    </button>
    <div class="top-center">
      <div class="drill-counter" id="drillCounter">Drill 1 of …</div>
      <div class="session-label" id="sessionLabel">Loading…</div>
    </div>
    <button class="timer-display" type="button" id="timerBtn" title="Tap to pause/resume" aria-label="Timer">0:00</button>
  </header>

  <!-- Progress bar -->
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <!-- Drill stage (slides rendered here by JS) -->
  <div class="drill-stage" id="drillStage"></div>

  <!-- Bottom action bar -->
  <div class="action-bar" id="actionBar">
    <button class="btn-prev" type="button" id="btnPrev" disabled aria-label="Previous drill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>
    <button class="btn-next" type="button" id="btnNext">
      <span id="nextLabel">Next Drill</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </button>
  </div>

  <!-- Completion overlay -->
  <div class="completion-overlay" id="completionOverlay">
    <div class="completion-check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="completion-title">Session done.</div>
    <div class="completion-sub" id="completionSub">Great work. Go cool down.</div>

    <!-- Post-session note -->
    <div class="sn-area" id="sessionNoteArea">
      <div class="sn-label">Session note</div>
      <textarea class="sn-input" id="sessionNoteInput" rows="3" placeholder="What did you observe? What to work on next…"></textarea>
      <button class="sn-save" id="sessionNoteSaveBtn" type="button">Save note</button>
      <button class="export-ann-btn" id="exportAnnBtn" type="button">Export clip annotations</button>
    </div>

    <div class="completion-actions">
      <button class="completion-btn primary" id="backToPlanBtn">← Back to Plan</button>
      <button class="completion-btn ghost" onclick="dismissCompletion()">← Last drill</button>
      <button class="completion-btn ghost" onclick="restartSession()">Run it again</button>
    </div>
  </div>

  <!-- Recording playback overlay -->
  <div class="rec-overlay" id="recOverlay">
    <div class="rec-panel">
      <div class="rec-panel-hdr">
        <div class="rec-panel-hdr-text">
          <div class="rec-panel-title">Clip review</div>
          <div class="rec-panel-sub" id="recPanelDrill">—</div>
        </div>
        <button class="rec-close" id="recCloseBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="rec-video-wrap">
        <video id="recVideo" playsinline></video>
      </div>
      <div class="rec-controls">
        <div class="rec-scrub-row">
          <input class="rec-scrub" id="recScrub" type="range" min="0" max="100" value="0" step="0.1">
          <div class="rec-time" id="recTime">0:00</div>
        </div>
        <div class="rec-btn-row">
          <button class="rec-play" id="recPlayBtn" type="button">
            <svg id="recPlayIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <div class="rec-speeds">
            <button class="rec-spd on" data-rate="1" type="button">1×</button>
            <button class="rec-spd" data-rate="0.5" type="button">0.5×</button>
            <button class="rec-spd" data-rate="0.25" type="button">0.25×</button>
          </div>
        </div>
      </div>
      <div class="rec-action-row">
        <button class="rec-save" id="recSaveBtn" type="button">Save to Camera Roll</button>
        <button class="rec-annotate" id="recAnnotateBtn" type="button">+ Note</button>
      </div>
      <div class="rec-ann-list" id="recAnnList" style="display:none"></div>
    </div>
  </div>

</div><!-- /app -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db.js"></script>
<script src="drill_library.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   On-ice session — drill carousel
   ─────────────────────────────────────────────────────────── */

// Parse URL params
const _sp = new URLSearchParams(window.location.search);
const SESSION = {
  goalie:    _sp.get('goalie')    || '',
  sessionId: _sp.get('sessionId') || '',
  focus:     _sp.get('focus')     || '',
  duration:  _sp.get('duration')  || '',
  level:     _sp.get('level')     || '',
  goalieId:  _sp.get('goalieId')  || '',
};

// ── Phase colors ──────────────────────────────────────────────
const PHASE_COLOR = {
  skating: '#18a6c8',
  shot:    '#e05c2a',
  skill:   '#378ADD',
  compete: '#17a064',
};

const PHASE_LABEL = {
  skating: 'Skating Warm-Up',
  shot:    'Shot Warm-Up',
  skill:   'Skill Work',
  compete: 'Compete',
};

// ── Flatten plan into ordered drill list ──────────────────────
function loadDrills() {
  try {
    const raw = localStorage.getItem('hh_pending_plan');
    if (!raw) return null;
    const plan = JSON.parse(raw);
    if (!plan || !plan.sections) return null;
    const flat = [];
    for (const section of plan.sections) {
      for (const drill of (section.drills || [])) {
        flat.push({ ...drill, phase: section.phase });
      }
    }
    return flat.length ? flat : null;
  } catch (e) {
    return null;
  }
}

// ── Render no-plan fallback ───────────────────────────────────
function renderNoPlan() {
  const stage = document.getElementById('drillStage');
  stage.innerHTML = `
    <div class="no-plan">
      <div class="no-plan-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/>
        </svg>
      </div>
      <h2>No plan loaded</h2>
      <p>Build a plan from the home screen first, then come back to run it on-ice.</p>
      <a href="index.html">← Back to home</a>
    </div>`;
  document.getElementById('actionBar').style.display = 'none';
}

// ── Build drill slide HTML ────────────────────────────────────
function buildSlideHtml(drill, idx, total) {
  const phase   = drill.phase || 'skill';
  const color   = PHASE_COLOR[phase]  || PHASE_COLOR.skill;
  const label   = PHASE_LABEL[phase]  || 'Skill Work';

  // Try to find clip from drill library if not in plan drill
  const lib     = (window.DRILL_LIBRARY || []).find(d => d.id === drill.drill_id);
  const clip    = drill.clip || (lib ? lib.clip_file : '') || '';
  const desc    = drill.description || (lib ? lib.description : '') || '';
  const cues    = drill.cues || (lib ? (lib.coaching_cues || []).slice(0, 4) : []);
  const duration = drill.duration || (lib ? lib.duration_minutes + ' min' : '');
  const difficulty = drill.difficulty || (lib ? lib.difficulty : '') || '';

  const videoHtml = clip
    ? `<video id="drillVideo${idx}" controls autoplay muted loop playsinline webkit-playsinline>
         <source src="${escA(clip)}" type="video/mp4">
       </video>
       <a class="video-download-btn" href="${escA(clip)}" download title="Download clip">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
         </svg>
       </a>`
    : `<div class="no-clip-placeholder">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
           <polygon points="6 3 20 12 6 21 6 3"/>
         </svg>
         <span>No clip available</span>
       </div>`;

  const cuesHtml = cues.map((c, i) =>
    `<div class="cue"><div class="cue-num">${i + 1}</div><span>${escH(c)}</span></div>`
  ).join('');

  const descHtml = desc
    ? `<div class="drill-desc">${escH(desc)}</div>`
    : '';

  const durationBadge  = duration   ? `<div class="badge">${escH(duration)}</div>` : '';
  const diffBadge      = difficulty ? `<div class="badge" style="text-transform:capitalize">${escH(difficulty)}</div>` : '';

  return `
<div class="slide slide-right" id="slide-${idx}" data-index="${idx}">
  <div class="video-block" style="position:relative">
    ${videoHtml}
    <div class="rec-indicator" id="recInd${idx}"><div class="rec-dot"></div><span id="recIndTime${idx}">0:00</span></div>
    <button class="record-btn" id="recBtn${idx}" type="button" title="Record clip" onclick="toggleRecording(${idx})">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>
  <div class="drill-info">
    <div>
      <span class="phase-pill" style="background:${color}22;color:${color}">
        <span class="phase-dot" style="background:${color}"></span>
        ${escH(drill.phaseLabel || label)}
      </span>
      <div class="drill-name-row">
        <div class="drill-name">${escH(drill.name || 'Unnamed drill')}</div>
      </div>
      <div class="drill-badges">${durationBadge}${diffBadge}</div>
    </div>
    ${cues.length ? `<div class="cues-label">Coaching cues</div><div class="cues">${cuesHtml}</div>` : ''}
    ${descHtml}
    <div class="swipe-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span>swipe or use arrows</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </div>
  </div>
</div>`;
}

function escH(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return String(s || '').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── State ─────────────────────────────────────────────────────
let drills     = [];
let current    = 0;
let timerSecs  = 0;
let timerOn    = false;
let timerInt   = null;

// ── Init ──────────────────────────────────────────────────────
function init() {
  drills = loadDrills();

  if (!drills) {
    renderNoPlan();
    return;
  }

  // Set session label
  const goalie = SESSION.goalie || 'Session';
  document.getElementById('sessionLabel').textContent = goalie;

  // Pre-render all slides
  const stage = document.getElementById('drillStage');
  stage.innerHTML = drills.map((d, i) => buildSlideHtml(d, i, drills.length)).join('');

  // Show first slide
  goTo(0, false);
  startTimer();

  // Wire buttons
  document.getElementById('btnBack').addEventListener('click', () => {
    window.location.href = 'lesson_plan_preview_crease_positioning.html?' + new URLSearchParams({
      goalie:    SESSION.goalie,
      sessionId: SESSION.sessionId,
      focus:     SESSION.focus,
      duration:  SESSION.duration,
      level:     SESSION.level,
    }).toString();
  });

  document.getElementById('backToPlanBtn').addEventListener('click', () => {
    window.location.href = 'lesson_plan_preview_crease_positioning.html?' + new URLSearchParams({
      goalie:    SESSION.goalie,
      sessionId: SESSION.sessionId,
      focus:     SESSION.focus,
      duration:  SESSION.duration,
      level:     SESSION.level,
    }).toString();
  });

  document.getElementById('btnPrev').addEventListener('click', () => goTo(current - 1));
  document.getElementById('btnNext').addEventListener('click', () => {
    if (current >= drills.length - 1) {
      showCompletion();
    } else {
      goTo(current + 1);
    }
  });

  // Swipe gestures
  let touchStartX = 0;
  let touchStartY = 0;
  stage.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  stage.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx) * 0.8) return;
    if (dx < 0 && current < drills.length - 1) goTo(current + 1);
    else if (dx > 0 && current > 0) goTo(current - 1);
    else if (dx < 0 && current === drills.length - 1) showCompletion();
  }, { passive: true });

  // Timer tap to pause/resume
  document.getElementById('timerBtn').addEventListener('click', toggleTimer);
}

// ── Navigate to drill ─────────────────────────────────────────
function goTo(idx, animate = true) {
  if (idx < 0 || idx >= drills.length) return;

  const oldSlide = document.getElementById('slide-' + current);
  const newSlide = document.getElementById('slide-' + idx);
  if (!newSlide) return;

  const forward = idx > current;

  if (animate && oldSlide) {
    oldSlide.style.transition = 'transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1)';
    newSlide.style.transition  = 'none';
    newSlide.style.transform   = forward ? 'translateX(100%)' : 'translateX(-100%)';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        newSlide.style.transition = 'transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1)';
        newSlide.style.transform  = 'translateX(0)';
        oldSlide.style.transform  = forward ? 'translateX(-100%)' : 'translateX(100%)';
      });
    });
  } else {
    // Instant: hide all, show current
    document.querySelectorAll('.slide').forEach(s => {
      s.style.transition = 'none';
      s.style.transform  = s === newSlide ? 'translateX(0)' : 'translateX(100%)';
    });
  }

  current = idx;

  // Autoplay video for new slide
  setTimeout(() => {
    const vid = document.getElementById('drillVideo' + idx);
    if (vid) {
      vid.currentTime = 0;
      vid.play().catch(() => {});
    }
    // Pause video on previous slide
    if (oldSlide) {
      const oldVid = oldSlide.querySelector('video');
      if (oldVid) oldVid.pause();
    }
  }, 200);

  updateChrome();
  resetTimer();
}

// ── Update header / buttons ───────────────────────────────────
function updateChrome() {
  const total    = drills.length;
  const isFirst  = current === 0;
  const isLast   = current === total - 1;

  document.getElementById('drillCounter').textContent = `Drill ${current + 1} of ${total}`;
  document.getElementById('progressFill').style.width = `${((current + 1) / total) * 100}%`;
  document.getElementById('btnPrev').disabled = isFirst;

  const nextBtn   = document.getElementById('btnNext');
  const nextLabel = document.getElementById('nextLabel');
  if (isLast) {
    nextBtn.classList.add('is-last');
    nextLabel.textContent = 'Finish Session';
    nextBtn.querySelector('svg').style.display = 'none';
  } else {
    nextBtn.classList.remove('is-last');
    nextLabel.textContent = 'Next Drill';
    nextBtn.querySelector('svg').style.display = '';
  }
}

// ── Timer ─────────────────────────────────────────────────────
function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function startTimer() {
  timerOn  = true;
  timerInt = setInterval(() => {
    if (!timerOn) return;
    timerSecs++;
    const btn = document.getElementById('timerBtn');
    btn.textContent = formatTime(timerSecs);
    btn.classList.toggle('running', true);
  }, 1000);
}

function resetTimer() {
  timerSecs = 0;
  timerOn   = true;
  document.getElementById('timerBtn').textContent = '0:00';
}

function toggleTimer() {
  timerOn = !timerOn;
  const btn = document.getElementById('timerBtn');
  btn.classList.toggle('running', timerOn);
}

// ── Session completion ────────────────────────────────────────
function showCompletion() {
  stopTimer();
  const goalie = SESSION.goalie || 'Good session';
  const sub = `${drills.length} drill${drills.length !== 1 ? 's' : ''} completed${goalie ? ' with ' + goalie : ''}.`;
  document.getElementById('completionSub').textContent = sub;
  document.getElementById('completionOverlay').classList.add('visible');
  document.getElementById('actionBar').style.display = 'none';
}

function stopTimer() {
  timerOn = false;
  clearInterval(timerInt);
}

function restartSession() {
  document.getElementById('completionOverlay').classList.remove('visible');
  document.getElementById('actionBar').style.display = '';
  goTo(0, false);
  resetTimer();
  startTimer();
}

function dismissCompletion() {
  // Hide the overlay and return to the last drill — no reload, works offline
  document.getElementById('completionOverlay').classList.remove('visible');
  document.getElementById('actionBar').style.display = '';
}

// ── Boot ──────────────────────────────────────────────────────
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// ── Session note (Feature 1) ──────────────────────────────────

document.getElementById('sessionNoteSaveBtn').addEventListener('click', () => {
  const input = document.getElementById('sessionNoteInput');
  const btn   = document.getElementById('sessionNoteSaveBtn');
  const note  = (input.value || '').trim();
  if (!note) return;

  const goalieId = SESSION.goalieId;
  const saved = goalieId && window.DB ? window.DB.addSessionNote(goalieId, note) : false;

  btn.classList.add('saved');
  if (saved) {
    input.value = '';
    btn.textContent = 'Saved ✓';
  } else {
    // No DB / no goalieId — copy to clipboard so the note isn't lost
    if (navigator.clipboard) navigator.clipboard.writeText(note).catch(() => {});
    btn.textContent = 'Copied to clipboard';
  }
  setTimeout(() => { btn.textContent = 'Save note'; btn.classList.remove('saved'); }, 2500);
});

// ── Video recording (Feature 3) ───────────────────────────────

let _recorder    = null;
let _recChunks   = [];
let _recDrillIdx = null;
let _recTimerInt = null;
let _recSecs     = 0;
const _annotations = []; // { drillName, timecode, note }

function _fmtSecs(s) {
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

async function toggleRecording(drillIdx) {
  if (_recorder && _recorder.state === 'recording') {
    _stopRecording();
  } else {
    await _startRecording(drillIdx);
  }
}

async function _startRecording(drillIdx) {
  if (_recorder && _recorder.state === 'recording') _stopRecording();

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true,
    });
  } catch {
    alert('Camera access denied. Grant camera permission in Settings and try again.');
    return;
  }

  _recChunks   = [];
  _recDrillIdx = drillIdx;
  _recSecs     = 0;

  const mime = ['video/webm;codecs=vp9,opus', 'video/webm', ''].find(t => !t || MediaRecorder.isTypeSupported(t));
  _recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  _recorder.ondataavailable = e => { if (e.data && e.data.size > 0) _recChunks.push(e.data); };
  _recorder.onstop = _onRecordingStop;
  _recorder.start(100);

  const btn = document.getElementById('recBtn' + drillIdx);
  const ind = document.getElementById('recInd' + drillIdx);
  if (btn) { btn.classList.add('recording'); btn.title = 'Stop recording'; }
  if (ind) ind.classList.add('visible');

  _recTimerInt = setInterval(() => {
    _recSecs++;
    const el = document.getElementById('recIndTime' + drillIdx);
    if (el) el.textContent = _fmtSecs(_recSecs);
  }, 1000);
}

function _stopRecording() {
  if (!_recorder) return;
  _recorder.stream.getTracks().forEach(t => t.stop());
  _recorder.stop();
  clearInterval(_recTimerInt);
  const btn = document.getElementById('recBtn' + _recDrillIdx);
  const ind = document.getElementById('recInd' + _recDrillIdx);
  if (btn) { btn.classList.remove('recording'); btn.title = 'Record clip'; }
  if (ind) ind.classList.remove('visible');
}

function _onRecordingStop() {
  const blob      = new Blob(_recChunks, { type: _recorder.mimeType || 'video/webm' });
  const drill     = drills[_recDrillIdx];
  const drillName = drill ? (drill.name || 'Drill ' + (_recDrillIdx + 1)) : 'Recording';
  _openPlayback(URL.createObjectURL(blob), blob, drillName);
  _recorder = null;
}

// ── Playback panel ────────────────────────────────────────────

let _curBlob      = null;
let _curAnnDrill  = '';

function _openPlayback(url, blob, drillName) {
  _curBlob     = blob;
  _curAnnDrill = drillName;

  const video  = document.getElementById('recVideo');
  const scrub  = document.getElementById('recScrub');
  const timeEl = document.getElementById('recTime');

  document.getElementById('recPanelDrill').textContent = drillName;
  video.src = url;

  video.ontimeupdate = () => {
    if (!video.duration) return;
    scrub.value = (video.currentTime / video.duration) * 100;
    timeEl.textContent = _fmtSecs(video.currentTime);
  };
  video.onended = () => _setPlayIcon(false);

  scrub.oninput = () => { if (video.duration) video.currentTime = (scrub.value / 100) * video.duration; };

  document.getElementById('recPlayBtn').onclick = () => {
    if (video.paused) { video.play(); _setPlayIcon(true); }
    else              { video.pause(); _setPlayIcon(false); }
  };

  document.querySelectorAll('.rec-spd').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.rec-spd').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      video.playbackRate = parseFloat(btn.dataset.rate);
    };
  });

  document.getElementById('recSaveBtn').onclick = () => {
    const ext  = blob.type.includes('mp4') ? 'mp4' : 'webm';
    const name = `clip-${drillName.replace(/\s+/g, '-').toLowerCase()}.${ext}`;
    const file = new File([blob], name, { type: blob.type });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: drillName }).catch(() => _dlBlob(blob, name));
    } else {
      _dlBlob(blob, name);
    }
  };

  document.getElementById('recAnnotateBtn').onclick = () => {
    video.pause();
    _setPlayIcon(false);
    const tc   = video.currentTime || 0;
    const note = prompt(`Coaching note at ${_fmtSecs(tc)} — what do you see?`);
    if (!note || !note.trim()) return;
    _annotations.push({ drillName, timecode: tc, note: note.trim() });
    _renderAnn();
    document.getElementById('exportAnnBtn').classList.add('visible');
  };

  _renderAnn();
  document.getElementById('recOverlay').classList.add('visible');
  video.play().catch(() => {});
  _setPlayIcon(true);
}

function _setPlayIcon(playing) {
  document.getElementById('recPlayIcon').innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5 3 19 12 5 21 5 3"/>';
}

function _renderAnn() {
  const list = document.getElementById('recAnnList');
  const ann  = _annotations.filter(a => a.drillName === _curAnnDrill);
  if (!ann.length) { list.style.display = 'none'; return; }
  list.style.display = 'flex';
  list.innerHTML = ann.sort((a, b) => a.timecode - b.timecode).map(a =>
    `<div class="rec-ann-item"><span class="rec-ann-ts">${_fmtSecs(a.timecode)}</span><span>${escH(a.note)}</span></div>`
  ).join('');
}

function _dlBlob(blob, name) {
  const a  = document.createElement('a');
  a.href   = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

document.getElementById('recCloseBtn').addEventListener('click', () => {
  const video = document.getElementById('recVideo');
  video.pause();
  video.src = '';
  document.getElementById('recOverlay').classList.remove('visible');
  _curBlob = null;
});

document.getElementById('exportAnnBtn').addEventListener('click', () => {
  if (!_annotations.length) return;
  const lines = _annotations
    .sort((a, b) => a.timecode - b.timecode)
    .map(a => `[${a.drillName}] ${_fmtSecs(a.timecode)} — ${a.note}`);
  const text = 'Session clip annotations:\n' + lines.join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('exportAnnBtn');
      const orig = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(() => { btn.textContent = orig; }, 2200);
    }).catch(() => alert(text));
  } else {
    alert(text);
  }
});
</script>
</body>
</html>
