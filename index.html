      : (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function tone(name) {
    return TONES[((name || '').toUpperCase().charCodeAt(0) || 65) % 4];
  }
  function formatTime(iso) {
    const d = new Date(iso);
    const h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hr = h % 12 || 12;
    return `${hr}:${m.toString().padStart(2, '0')} ${ampm}`;
  }
  function minutesBetween(startIso, endIso) {
    return Math.round((new Date(endIso) - new Date(startIso)) / 60000);
  }
  function relativeTime(startIso) {
    const diff = Math.round((new Date(startIso) - Date.now()) / 60000);
    if (diff < 0)  return 'in progress';
    if (diff < 60) return `in ${diff}m`;
    const h = Math.floor(diff / 60), m = diff % 60;
    return m > 0 ? `in ${h}h ${m}m` : `in ${h}h`;
  }
  function dayLabel(iso) {
    const d   = new Date(iso);
    const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    return dow;
  }
  function sessionId(event) {
    // Stable ID from event id (first 8 chars) + date
    const date = (event.start.dateTime || event.start.date || '').slice(0, 10).replace(/-/g, '');
    return `cal_${(event.id || '').slice(0, 8)}_${date}`;
  }
  function isToday(iso) {
    const d = new Date(iso);
    const n = new Date();
    return d.getFullYear() === n.getFullYear()
        && d.getMonth()    === n.getMonth()
        && d.getDate()     === n.getDate();
  }

  /* ── Title parser: "Goalie Lesson – {names} – {rink}" ─── */
  function parseTitle(title) {
    // Handles em-dash (–), en-dash (–), hyphen-minus (-)
    const parts = title.split(/\s*[–—-]\s*/);
    if (parts.length < 2) return null;   // not our format
    const names   = parts[1]?.trim() || '';
    const rinkRaw = parts[2]?.trim() || '';
    return { names, rink: expandRink(rinkRaw) };
  }

  /* ── Card builders ─────────────────────────────────────── */
  function buildHeroCard(event, parsed) {
    const sid      = sessionId(event);
    const timeStr  = formatTime(event.start.dateTime);
    const dur      = minutesBetween(event.start.dateTime, event.end.dateTime);
    const rel      = relativeTime(event.start.dateTime);
    const goalies  = parsed.names.split(/\s*&\s*/).map(n => n.trim()).filter(Boolean);
    const count    = goalies.length;
    const privLabel = count > 1 ? 'Semi-private' : 'Private';
    const isMulti  = count > 1;

    const avatarsHtml = goalies.slice(0, 2).map(n =>
      `<div class="hero-goalie-avatar">${initials(n)}</div>`
    ).join('');

    const nameDisplay = count > 2
      ? goalies.slice(0, 2).map(n => n.split(' ')[0]).join(' & ') + ` +${count - 2}`
      : parsed.names;

    return `
    <article class="lesson-card hero">
      <div class="hero-eyebrow-row">
        <span class="hero-eyebrow"><span class="pulse"></span>Next up · ${timeStr}</span>
        <span class="hero-time-badge">${rel}</span>
      </div>
      <div class="hero-body">
        <div class="hero-time">${timeStr}</div>
        <div class="hero-duration">${dur} min · ${privLabel}</div>
        <div class="hero-rink">
          <svg class="lucide"><use href="#i-map-pin"/></svg>
          ${parsed.rink || 'Location TBD'}
        </div>
        <div class="hero-goalies">
          <div class="goalie-avatars">${avatarsHtml}</div>
          <div class="hero-goalie-text">
            <div class="hero-goalie-names">${nameDisplay}</div>
            <div class="hero-goalie-context">${dur} min · ${privLabel}</div>
          </div>
        </div>
      </div>
      <div class="hero-cta-row">
        <button class="hero-cta" type="button">
          <svg class="lucide"><use href="${isMulti ? '#i-users' : '#i-user'}"/></svg>
          Profile
        </button>
        <button class="hero-cta primary" type="button"
          data-build-plan
          data-session-id="${sid}"
          data-goalie="${parsed.names.replace(/"/g, '&quot;')}"
          data-time="${timeStr}"
          data-count="${count}"
          data-level="intermediate"
          data-duration="${dur}">
          <svg class="lucide"><use href="#i-sparkles"/></svg>
          Build plan
        </button>
      </div>
    </article>`;
  }

  function buildRegularCard(event, parsed, weekMode) {
    const sid      = sessionId(event);
    const timeStr  = formatTime(event.start.dateTime);
    const dur      = minutesBetween(event.start.dateTime, event.end.dateTime);
    const goalies  = parsed.names.split(/\s*&\s*/).map(n => n.trim()).filter(Boolean);
    const count    = goalies.length;
    const privLabel = count > 1 ? 'Semi-private' : 'Private';
    const isMulti  = count > 1;

    const timeLabel = weekMode ? `${dayLabel(event.start.dateTime)} · ${timeStr}` : timeStr;

    const avatarsHtml = goalies.slice(0, 3).map((n, i) => {
      const extra = i > 0 ? ` style="margin-left:-8px;border:2px solid var(--hh-surface)"` : '';
      return `<div class="goalie-avatar ${tone(n)}"${extra}>${initials(n)}</div>`;
    }).join('');

    const nameDisplay = count > 3
      ? goalies.slice(0, 2).map(n => n.split(' ')[0]).join(' & ') + ` +${count - 2}`
      : parsed.names;

    return `
    <article class="lesson-card">
      <div class="lesson-card-body">
        <div class="lesson-meta-row">
          <div class="lesson-time">
            <div class="lesson-time-block">
              <span class="lesson-time-primary">${timeLabel}</span>
              <span class="lesson-time-duration">${dur} min · ${privLabel}</span>
            </div>
          </div>
        </div>
        <div class="lesson-info-row">
          <svg class="lucide"><use href="#i-map-pin"/></svg>
          ${parsed.rink || 'Location TBD'}
        </div>
        <div class="lesson-goalies">
          <div class="goalie-avatars">${avatarsHtml}</div>
          <div class="goalie-details">
            <div class="goalie-names">${nameDisplay}</div>
            <div class="goalie-context">${dur} min · ${privLabel}</div>
          </div>
        </div>
      </div>
      <div class="lesson-cta-row">
        <button class="lesson-cta" type="button">
          <svg class="lucide"><use href="${isMulti ? '#i-users' : '#i-user'}"/></svg>
          Profile
        </button>
        <button class="lesson-cta primary" type="button"
          data-build-plan
          data-session-id="${sid}"
          data-goalie="${parsed.names.replace(/"/g, '&quot;')}"
          data-time="${timeLabel}"
          data-count="${count}"
          data-level="intermediate"
          data-duration="${dur}">
          <svg class="lucide"><use href="#i-sparkles"/></svg>
          Build plan
        </button>
      </div>
    </article>`;
  }

  function wireNewCards() {
    // Apply saved-plan state + open sheet listener to any newly created cards
    document.querySelectorAll('[data-build-plan]:not([data-wired])').forEach(btn => {
      btn.dataset.wired = '1';
      const sessionId = btn.dataset.sessionId;
      // Check for existing saved plan
      if (sessionId && window.DB && DB.hasSavedPlan(sessionId)) {
        const useEl = btn.querySelector('use');
        if (useEl) useEl.setAttribute('href', '#i-arrow-right');
        btn.dataset.seePlan = 'lesson_plan_preview_crease_positioning.html';
        btn.classList.add('see-plan-mode');
        for (const node of btn.childNodes) {
          if (node.nodeType === Node.TEXT_NODE && node.textContent.includes('Build')) {
            node.textContent = node.textContent.replace('Build plan', 'See plan');
            break;
          }
        }
      }
      btn.addEventListener('click', () => {
        if (btn.dataset.seePlan) { window.location.href = btn.dataset.seePlan; return; }
        // openSheet is exposed globally from the other script block
        if (typeof window._hhOpenSheet === 'function') {
          window._hhOpenSheet({
            sessionId: btn.dataset.sessionId || null,
            goalie:    btn.dataset.goalie,
            time:      btn.dataset.time,
            count:     btn.dataset.count,
            level:     btn.dataset.level    || 'intermediate',
            duration:  btn.dataset.duration || '60',
            shooters:  btn.dataset.count    || '1',
          });
        }
      });
    });
  }

  /* ── Render sections ───────────────────────────────────── */
  function isPast(iso) {
    return new Date(iso) < new Date();
  }

  function formatShortDate(iso) {
    const d    = new Date(iso);
    const mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${mons[d.getMonth()]} ${d.getDate()}`;
  }

  function buildRecentCard(event, parsed) {
    const goalies   = parsed.names.split(/\s*&\s*/).map(n => n.trim()).filter(Boolean);
    const count     = goalies.length;
    const dur       = minutesBetween(event.start.dateTime, event.end.dateTime);
    const privLabel = count > 1 ? 'Semi-private' : 'Private';
    const dateStr   = formatShortDate(event.start.dateTime);
    const sid       = sessionId(event);

    const avatarHtml = count === 1
      ? `<div class="goalie-avatar ${tone(goalies[0])}" style="width:40px;height:40px;font-size:12px;font-weight:700;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;">${initials(goalies[0])}</div>`
      : `<div style="display:flex;flex-shrink:0;">
           <div class="goalie-avatar ${tone(goalies[0])}" style="width:40px;height:40px;font-size:11px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;">${initials(goalies[0])}</div>
           <div class="goalie-avatar ${tone(goalies[1])}" style="width:40px;height:40px;font-size:11px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:-12px;border:2px solid var(--hh-surface);">${initials(goalies[1])}</div>
         </div>`;

    return `
    <div class="plan-card" data-recent-sid="${sid}">
      ${avatarHtml}
      <div class="plan-body">
        <div class="plan-goalie-row">
          <div class="plan-goalie-name">${parsed.names}</div>
          <div class="plan-date">${dateStr}</div>
        </div>
        <div class="plan-meta" style="margin-top:2px;">
          <span>${dur} min</span>
          <span class="plan-meta-dot"></span>
          <span>${privLabel}</span>
          ${parsed.rink ? `<span class="plan-meta-dot"></span><span>${parsed.rink.split('·')[0].trim()}</span>` : ''}
        </div>
      </div>
      <div class="plan-chevron"><svg class="lucide"><use href="#i-chevron-right"/></svg></div>
    </div>`;
  }

  function renderSections(allEvents) {
    const now         = new Date();
    const pastEvents  = allEvents.filter(e => isPast(e.end?.dateTime || e.start.dateTime)).reverse(); // newest first
    const futureEvents = allEvents.filter(e => !isPast(e.end?.dateTime || e.start.dateTime));
    const todayEvents = futureEvents.filter(e => isToday(e.start.dateTime));
    const weekEvents  = futureEvents.filter(e => !isToday(e.start.dateTime));

    const todayEl    = document.getElementById('cal-today');
    const weekEl     = document.getElementById('cal-week');
    const recentEl   = document.getElementById('cal-recent');
    const recentSec  = document.getElementById('recent-section');
    const todayCount = document.getElementById('today-count');
    const weekCount  = document.getElementById('week-count');

    // ── Today ──
    if (todayEvents.length === 0) {
      todayEl.innerHTML = '<div class="cal-empty">No lessons today.</div>';
      if (todayCount) todayCount.textContent = '';
    } else {
      if (todayCount) todayCount.textContent = `${todayEvents.length} lesson${todayEvents.length !== 1 ? 's' : ''}`;
      let html = buildHeroCard(todayEvents[0], parseTitle(todayEvents[0].summary) || { names: todayEvents[0].summary, rink: '' });
      for (let i = 1; i < todayEvents.length; i++) {
        const p = parseTitle(todayEvents[i].summary) || { names: todayEvents[i].summary, rink: '' };
        html += buildRegularCard(todayEvents[i], p, false);
      }
      todayEl.innerHTML = html;
    }

    // ── This week ──
    if (weekEvents.length === 0) {
      weekEl.innerHTML = '<div class="cal-empty">No more lessons this week.</div>';
      if (weekCount) weekCount.textContent = '';
    } else {
      if (weekCount) weekCount.textContent = `${weekEvents.length} lesson${weekEvents.length !== 1 ? 's' : ''}`;
      let html = '';
      weekEvents.forEach(e => {
        const p = parseTitle(e.summary) || { names: e.summary, rink: '' };
        html += buildRegularCard(e, p, true);
      });
      weekEl.innerHTML = html;
    }

    // ── Recent lessons (past events, newest first, max 5) ──
    const recentSlice = pastEvents.slice(0, 5);
    if (recentSlice.length > 0 && recentEl && recentSec) {
      recentSec.style.display = '';
      let html = '';
      recentSlice.forEach(e => {
        const p = parseTitle(e.summary) || { names: e.summary, rink: '' };
        html += buildRecentCard(e, p);
      });
      recentEl.innerHTML = html;
    }

    wireNewCards();
  }

  /* ── API fetch ─────────────────────────────────────────── */
  async function fetchCalendar(accessToken, calId, timeMin, timeMax) {
    const params = new URLSearchParams({
      timeMin:      timeMin.toISOString(),
      timeMax:      timeMax.toISOString(),
      singleEvents: 'true',
      orderBy:      'startTime',
      maxResults:   '50',
    });
    const resp = await fetch(
      `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?${params}`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (resp.status === 401) { clearToken(); throw new Error('token_expired'); }
    if (!resp.ok) throw new Error(`Calendar API error: ${resp.status}`);
    const data = await resp.json();
    return data.items || [];
  }

  function isGoalieLesson(e) {
    return e.start?.dateTime && (e.summary || '').toLowerCase().includes('goalie lesson');
  }

  async function fetchEvents(accessToken) {
    const now        = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const past30     = new Date(startOfDay);
    past30.setDate(past30.getDate() - 30);
    const dayOfWeek  = now.getDay();
    const endOfWeek  = new Date(startOfDay);
    endOfWeek.setDate(endOfWeek.getDate() + (6 - dayOfWeek) + 1);

    // Fetch primary + group calendar in parallel, both covering past 30d → end of week
    const [primaryItems, groupItems] = await Promise.all([
      fetchCalendar(accessToken, 'primary',     past30, endOfWeek),
      fetchCalendar(accessToken, CALENDAR_ID,   past30, endOfWeek),
    ]);

    // Merge + deduplicate by iCalUID (same event can appear in both)
    const seen = new Set();
    const all  = [...primaryItems, ...groupItems].filter(e => {
      if (!isGoalieLesson(e)) return false;
      const key = e.iCalUID || e.id;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    // Sort ascending by start time
    all.sort((a, b) => new Date(a.start.dateTime) - new Date(b.start.dateTime));
    return all;
  }

  /* ── Connect button ────────────────────────────────────── */
  function showConnectState() {
    const todayEl = document.getElementById('cal-today');
    const weekEl  = document.getElementById('cal-week');
    const html = `
      <div class="cal-connect-wrap">
        <div class="cal-connect-card">
          <div class="cal-connect-icon">
            <svg class="lucide"><use href="#i-calendar"/></svg>
          </div>
          <p>Connect your Google Calendar to see today's lessons here automatically.</p>
          <button class="cal-connect-btn" id="calConnectBtn" type="button">
            <svg class="lucide" style="width:16px;height:16px"><use href="#i-calendar"/></svg>
            Connect Calendar
          </button>
        </div>
      </div>`;
    if (todayEl) todayEl.innerHTML = html;
    if (weekEl)  weekEl.innerHTML  = '';

    document.getElementById('calConnectBtn')?.addEventListener('click', requestAuth);
  }

  function showError(msg) {
    const todayEl = document.getElementById('cal-today');
    if (todayEl) todayEl.innerHTML = `<div class="cal-empty">Couldn't load calendar: ${msg}</div>`;
  }

  /* ── GIS OAuth ─────────────────────────────────────────── */
  let tokenClient;

  function requestAuth() {
    if (!tokenClient) {
      if (!window.google?.accounts?.oauth2) {
        showError('Google Identity Services not loaded yet. Try refreshing.');
        return;
      }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope:     SCOPE,
        callback:  async (resp) => {
          if (resp.error) { showError(resp.error); return; }
          const token = saveToken(resp);
          await loadAndRender(token);
        },
      });
    }
    tokenClient.requestAccessToken({ prompt: '' });
  }

  async function loadAndRender(accessToken) {
    const todayEl = document.getElementById('cal-today');
    if (todayEl) todayEl.innerHTML = '<div class="cal-loading"><span class="cal-spinner"></span>Loading schedule…</div>';
    try {
      const events = await fetchEvents(accessToken);
      renderSections(events);
    } catch (err) {
      if (err.message === 'token_expired') {
        showConnectState();
      } else {
        showError(err.message);
      }
    }
  }

  /* ── Silent re-auth ────────────────────────────────────── */
  // Called when the stored token is missing or expired.
  // Tries to get a fresh token silently (no popup) using GIS.
  // Only falls back to the "Connect" button if GIS can't auto-renew.
  function trySilentAuth() {
    // Show a loading spinner while we attempt silent re-auth
    const todayEl = document.getElementById('cal-today');
    if (todayEl) todayEl.innerHTML = '<div class="cal-loading"><span class="cal-spinner"></span>Loading schedule…</div>';

    function attemptSilent() {
      if (!window.google?.accounts?.oauth2) {
        showConnectState();
        return;
      }
      // Re-use existing tokenClient if already created, otherwise init one
      const client = tokenClient || google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope:     SCOPE,
        callback:  async (resp) => {
          if (resp.error) {
            // Silent auth failed (user not signed in, or revoked access)
            showConnectState();
            return;
          }
          const token = saveToken(resp);
          await loadAndRender(token);
        },
      });
      // prompt: '' = use existing consent silently, no popup
      client.requestAccessToken({ prompt: '' });
    }

    // GIS script is loaded async — poll briefly if not ready yet
    if (window.google?.accounts?.oauth2) {
      attemptSilent();
    } else {
      let waited = 0;
      const poll = setInterval(() => {
        waited += 150;
        if (window.google?.accounts?.oauth2) {
          clearInterval(poll);
          attemptSilent();
        } else if (waited >= 4000) {
          clearInterval(poll);
          showConnectState(); // GIS failed to load entirely
        }
      }, 150);
    }
  }

  /* ── Init ──────────────────────────────────────────────── */
  function init() {
    const token = loadToken();
    if (token) {
      loadAndRender(token); // still valid
    } else {
      trySilentAuth();      // expired — try silent renewal before showing connect
    }
  }

  // Wait for GIS script to load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
