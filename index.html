<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Hockey Hub Goalie · Coach Mitch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // Register service worker for offline support
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .catch(err => console.warn('[SW] Registration failed:', err));
    });
  }
</script>

<style>
  /* ─── Design tokens (HockeyHub + Goalie blend) ─── */
  :root {
    --hh-primary:        #7f56d9;
    --hh-primary-hover:  #6941c6;
    --hh-primary-tint:   #f4ebff;
    --hh-primary-tint-2: #e9d7fe;

    --hh-text-primary:   #181d27;
    --hh-text-secondary: #535862;
    --hh-text-tertiary:  #717680;
    --hh-text-muted:     #a4a7ae;

    --hh-border-light:   #e9eaeb;
    --hh-border-default: #d5d7da;

    --hh-bg-page:        #f9fafb;
    --hh-bg-surface:     #ffffff;
    --hh-bg-tertiary:    #fafafa;

    /* Brand navy — goalie identity */
    --gc-navy:           #1c3150;
    --gc-navy-2:         #243d63;

    /* Session-phase accents */
    --phase-skating:     #18a6c8;
    --phase-shot:        #e05c2a;
    --phase-skill:       #378ADD;
    --phase-compete:     #17a064;

    /* Status */
    --status-open:       #17B26A;
    --status-warning:    #b54708;

    --shadow-xs:         0px 1px 2px 0px rgba(10,13,18,0.05);
    --shadow-card:       0px 1px 3px 0px rgba(10,13,18,0.08), 0px 1px 2px 0px rgba(10,13,18,0.04);
    --shadow-navy:       0px 8px 24px -8px rgba(28,49,80,0.32);

    --r-sm: 8px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 18px;
    --r-2xl: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--hh-bg-page);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--hh-text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    background: var(--hh-bg-page);
    position: relative;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }

  /* ─── Top header ─── */
  .top-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--hh-border-light);
    padding: env(safe-area-inset-top) 16px 0;
  }

  .top-header-inner {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--gc-navy);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .brand-mark::before { display: none; }

  .brand-mark svg {
    width: 18px;
    height: 18px;
    color: #fff;
    position: relative;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .brand-product {
    font-size: 14px;
    font-weight: 600;
    color: var(--hh-text-primary);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .brand-parent {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--hh-text-tertiary);
    line-height: 1.2;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: transparent;
    border: none;
    color: var(--hh-text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.15s ease;
    font-family: inherit;
  }

  .icon-btn:hover { background: var(--hh-bg-tertiary); }
  .icon-btn:active { background: var(--hh-border-light); }

  .icon-btn svg {
    width: 20px;
    height: 20px;
  }

  .icon-btn .dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--hh-primary);
    border: 1.5px solid #fff;
  }

  .icon-btn-wrap { position: relative; }

  /* ─── Greeting ─── */
  .greeting {
    padding: 18px 18px 4px;
  }

  .greeting-eyebrow {
    font-size: 12px;
    font-weight: 500;
    color: var(--hh-text-tertiary);
    line-height: 1.4;
    margin-bottom: 2px;
  }

  .greeting-title {
    font-size: 24px;
    font-weight: 600;
    color: var(--hh-text-primary);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  /* ─── Section headers ─── */
  .section {
    padding: 20px 16px 0;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .section-head-left {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--hh-text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .section-count {
    font-size: 11px;
    font-weight: 500;
    color: var(--hh-text-muted);
  }

  .section-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--hh-primary);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .section-link svg { width: 14px; height: 14px; }

  /* ─── Lesson card ─── */
  .lesson-card {
    background: var(--hh-bg-surface);
    border-radius: var(--r-xl);
    border: 1px solid var(--hh-border-light);
    box-shadow: var(--shadow-card);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .lesson-card-body {
    padding: 14px 14px 12px;
  }

  .lesson-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .lesson-time {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .lesson-time-block {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .lesson-time-primary {
    font-size: 17px;
    font-weight: 600;
    color: var(--hh-text-primary);
    letter-spacing: -0.01em;
  }

  .lesson-time-duration {
    font-size: 11px;
    font-weight: 500;
    color: var(--hh-text-tertiary);
    margin-top: 2px;
  }

  .lesson-info-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--hh-text-tertiary);
    margin-bottom: 4px;
  }

  .lesson-info-row svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    color: var(--hh-text-muted);
  }

  .lesson-goalies {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 4px;
    margin-top: 8px;
    border-top: 1px solid var(--hh-border-light);
  }

  .goalie-avatars {
    display: flex;
    flex-shrink: 0;
  }

  .goalie-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--hh-bg-tertiary);
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--hh-text-secondary);
    margin-left: -8px;
  }

  .goalie-avatar:first-child { margin-left: 0; }

  .goalie-avatar.tone-a { background: #eef4ff; color: #1e4fb5; }
  .goalie-avatar.tone-b { background: #fef0e6; color: #b85c00; }
  .goalie-avatar.tone-c { background: #ecfdf5; color: #047857; }
  .goalie-avatar.tone-d { background: #faf5ff; color: #7e22ce; }

  .goalie-details {
    flex: 1;
    min-width: 0;
  }

  .goalie-names {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--hh-text-primary);
    line-height: 1.25;
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .goalie-context {
    font-size: 11.5px;
    color: var(--hh-text-tertiary);
    margin-top: 1px;
    line-height: 1.3;
  }

  /* ─── Lesson card CTA ─── */
  .lesson-cta-row {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--hh-border-light);
    background: var(--hh-bg-page);
  }

  .lesson-cta {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 8px;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--hh-text-secondary);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .lesson-cta.primary {
    color: var(--hh-primary);
  }

  /* "See plan" state — plan already built */
  .lesson-cta.primary.see-plan-mode,
  .hero-cta.primary.see-plan-mode {
    color: var(--status-open);
  }

  /* "Rebuild" secondary action — appears next to "See plan" */
  .rebuild-plan-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--hh-border-light);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--hh-text-secondary);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .rebuild-plan-btn svg { width: 12px; height: 12px; }
  .rebuild-plan-btn:hover { background: var(--hh-bg-tertiary); color: var(--hh-text-primary); }
  .rebuild-plan-btn:active { background: var(--hh-border-light); }

  .lesson-cta svg { width: 15px; height: 15px; }

  .lesson-cta:hover { background: var(--hh-bg-tertiary); }
  .lesson-cta:active { background: var(--hh-border-light); }

  .lesson-cta + .lesson-cta {
    border-left: 1px solid var(--hh-border-light);
  }

  /* ─── Hero lesson card (next up) ─── */
  .lesson-card.hero {
    background: var(--gc-navy);
    border-color: transparent;
    box-shadow: var(--shadow-navy);
    color: #fff;
    margin-bottom: 14px;
  }

  .hero-eyebrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 0;
  }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    color: rgba(255,255,255,0.78);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  .hero-eyebrow .pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6ee7b7;
    box-shadow: 0 0 0 0 rgba(110,231,183,0.7);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(110,231,183,0.7); }
    70%  { box-shadow: 0 0 0 8px rgba(110,231,183,0); }
    100% { box-shadow: 0 0 0 0 rgba(110,231,183,0); }
  }

  .hero-time-badge {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.78);
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.14);
    padding: 3px 9px;
    border-radius: 999px;
  }

  .hero-body {
    padding: 8px 16px 14px;
  }

  .hero-time {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .hero-duration {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    margin-bottom: 10px;
    letter-spacing: 0.005em;
  }

  .hero-rink {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.78);
    margin-bottom: 12px;
  }

  .hero-rink svg { width: 13px; height: 13px; color: rgba(255,255,255,0.6); }

  .hero-goalies {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.10);
  }

  .hero-goalie-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid var(--gc-navy);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    margin-left: -8px;
  }

  .hero-goalie-avatar:first-child { margin-left: 0; }

  .hero-goalie-text {
    flex: 1;
  }

  .hero-goalie-names {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    line-height: 1.25;
  }

  .hero-goalie-context {
    font-size: 11.5px;
    color: rgba(255,255,255,0.72);
    margin-top: 1px;
  }

  .hero-cta-row {
    display: flex;
    border-top: 1px solid rgba(255,255,255,0.10);
    background: rgba(0,0,0,0.10);
  }

  .hero-cta {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 15px 8px;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.82);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .hero-cta.primary { color: #fff; }
  .hero-cta svg { width: 15px; height: 15px; }
  .hero-cta:hover { background: rgba(255,255,255,0.06); }
  .hero-cta:active { background: rgba(255,255,255,0.10); }
  .hero-cta + .hero-cta { border-left: 1px solid rgba(255,255,255,0.10); }

  /* ─── Recent plan card ─── */
  .plan-card {
    background: var(--hh-bg-surface);
    border-radius: var(--r-lg);
    border: 1px solid var(--hh-border-light);
    box-shadow: var(--shadow-xs);
    padding: 13px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .plan-card:hover { background: var(--hh-bg-tertiary); }

  .plan-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .plan-icon svg { width: 18px; height: 18px; }

  .plan-icon.theme-skill    { background: #e8f0fb; color: var(--phase-skill); }
  .plan-icon.theme-compete  { background: #e6f7ee; color: var(--phase-compete); }
  .plan-icon.theme-shot     { background: #fdece2; color: var(--phase-shot); }
  .plan-icon.theme-skating  { background: #e1f4f8; color: var(--phase-skating); }

  .plan-body {
    flex: 1;
    min-width: 0;
  }

  /* Goalie-first row inside recent lessons card */
  .plan-goalie-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
    gap: 8px;
  }

  .plan-goalie-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--hh-text-primary);
    line-height: 1.25;
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .plan-date {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--hh-text-muted);
    flex-shrink: 0;
  }

  .plan-title {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--hh-text-secondary);
    line-height: 1.3;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .plan-meta {
    font-size: 11px;
    color: var(--hh-text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .plan-meta-dot {
    width: 2.5px;
    height: 2.5px;
    border-radius: 50%;
    background: var(--hh-text-muted);
    opacity: 0.5;
  }

  .plan-chevron {
    color: var(--hh-text-muted);
    flex-shrink: 0;
  }

  .plan-chevron svg { width: 16px; height: 16px; }

  /* ─── Bottom tab bar ─── */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 390px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--hh-border-light);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    display: flex;
    z-index: 50;
  }

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    background: transparent;
    border: none;
    font-family: inherit;
    color: var(--hh-text-tertiary);
    cursor: pointer;
    border-radius: 10px;
    transition: color 0.15s ease;
  }

  .tab.active { color: var(--hh-primary); }
  .tab:hover { color: var(--hh-text-secondary); }
  .tab.active:hover { color: var(--hh-primary-hover); }

  .tab svg {
    width: 22px;
    height: 22px;
    stroke-width: 2;
  }

  .tab-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* Inline lucide icons — ensure they fill the sized container the parent CSS sets */
  svg.lucide {
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
  }

  /* ───────────────────────────────────────────────────────────
     CHAT SHEET (bottom-rising modal for AI lesson planning)
     ─────────────────────────────────────────────────────────── */
  .chat-sheet {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    visibility: hidden;
  }

  .chat-sheet.open {
    pointer-events: auto;
    visibility: visible;
  }

  .chat-sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 24, 40, 0);
    transition: background 0.32s ease;
    cursor: pointer;
  }

  .chat-sheet.open .chat-sheet-backdrop { background: rgba(15, 24, 40, 0.52); }

  .chat-sheet-panel {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(calc(100% + 8px));
    width: 100%;
    max-width: 390px;
    /* Full-screen minus a peek gap at the top — iOS sheet convention */
    height: calc(100dvh - 12px);
    background: var(--hh-bg-surface);
    border-radius: 20px 20px 0 0;
    /* Layered shadow: broad ambient + tight edge */
    box-shadow:
      0 -1px 0 rgba(15,24,40,0.06),
      0 -8px 40px -4px rgba(15,24,40,0.22),
      0 -32px 80px -16px rgba(15,24,40,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
  }

  .chat-sheet.open .chat-sheet-panel {
    transform: translateX(-50%) translateY(0);
  }

  /* Drag handle — larger hit area, visible pill */
  .chat-sheet-handle {
    width: 100%;
    /* Generous padding so thumbs can grab it easily */
    padding: 14px 0 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
    flex-shrink: 0;
    touch-action: none;
    background: var(--hh-bg-surface);
  }

  .chat-sheet-handle::before {
    content: '';
    width: 36px;
    height: 5px;
    border-radius: 3px;
    background: var(--hh-border-default);
    opacity: 0.7;
  }

  /* Header */
  .chat-sheet-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 2px 16px 14px;
    border-bottom: 1px solid var(--hh-border-light);
    background: var(--hh-bg-surface);
    flex-shrink: 0;
  }

  .chat-sheet-avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--hh-primary-tint);
    color: var(--hh-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .chat-sheet-avatar svg { width: 18px; height: 18px; }

  .chat-sheet-title { flex: 1; min-width: 0; }

  .chat-sheet-title-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--hh-text-primary);
    letter-spacing: -0.005em;
    line-height: 1.2;
  }

  .chat-sheet-title-sub {
    font-size: 12px;
    color: var(--hh-text-tertiary);
    line-height: 1.3;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--hh-bg-tertiary);
    color: var(--hh-text-secondary);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .chat-sheet-close:hover { background: var(--hh-border-light); }
  .chat-sheet-close svg { width: 16px; height: 16px; }

  /* Thread */
  .chat-thread {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 14px 16px;
    background: #f3f4f6;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 10px;
    /* Smooth momentum scrolling on iOS */
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  /* Direct children must not flex-shrink — otherwise long threads
     compress later messages and zero-out the plan card */
  .chat-thread > * { flex-shrink: 0; }

  /* Optional context strip (when opened from a lesson card) */
  .chat-context-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--hh-bg-surface);
    border: 1px solid var(--hh-border-light);
    border-radius: var(--r-lg);
    margin-bottom: 4px;
  }

  .ctx-avatars {
    display: flex;
    flex-shrink: 0;
  }

  .ctx-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: -6px;
    border: 2px solid var(--hh-bg-surface);
    flex-shrink: 0;
  }

  .ctx-avatar:first-child { margin-left: 0; }

  .chat-context-text {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.35;
  }

  .chat-context-text strong {
    color: var(--hh-text-primary);
    font-weight: 600;
  }

  .chat-context-text span {
    color: var(--hh-text-tertiary);
  }

  /* Message bubble (assistant + user) */
  .chat-msg {
    display: flex;
    gap: 8px;
    max-width: 100%;
    animation: msg-fade-in 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  @keyframes msg-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .chat-msg.assistant { align-self: flex-start; }
  .chat-msg.user      { align-self: flex-end; flex-direction: row-reverse; }

  .chat-msg-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--hh-primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(127,86,217,0.28);
    align-self: flex-start;
    margin-top: 1px;
  }

  .chat-msg-avatar svg { width: 13px; height: 13px; }

  /* Intake question messages — label style, no bubble border */
  .chat-msg-bubble {
    flex: 1;
    padding: 0 0 0 10px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--hh-text-primary);
    background: transparent;
    letter-spacing: -0.01em;
  }

  /* Free-text assistant replies (after plan is generated) get a bubble */
  .chat-msg.assistant.has-bubble .chat-msg-bubble {
    flex: unset;
    max-width: 85%;
    padding: 11px 14px;
    border-radius: 18px 18px 18px 4px;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--hh-text-primary);
    background: #ffffff;
    letter-spacing: normal;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.06),
      0 2px 8px rgba(0,0,0,0.04);
  }

  /* User free-text messages (only shown after plan is done) */
  .chat-msg.user .chat-msg-bubble {
    background: var(--hh-primary);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    max-width: 82%;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: normal;
    box-shadow:
      0 1px 3px rgba(127,86,217,0.25),
      0 2px 10px rgba(127,86,217,0.15);
  }

  .chat-msg.user .chat-msg-avatar { display: none; }

  /* Chip row (quick-tap answers) — full width, no indent */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    /* Full horizontal real estate — no avatar indent */
    margin: 2px 0 6px 0;
    animation: msg-fade-in 0.28s 0.04s both cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .chip {
    appearance: none;
    background: var(--hh-bg-surface);
    border: 1.5px solid var(--hh-border-default);
    color: var(--hh-text-secondary);
    border-radius: 10px;
    /* Slightly more pill-like but with a flat bottom to read as a selectable tile */
    padding: 9px 16px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.1s ease, box-shadow 0.12s ease;
  }

  .chip:hover {
    background: var(--hh-primary-tint);
    border-color: var(--hh-primary-tint-2);
    color: var(--hh-primary);
  }

  .chip:active { transform: scale(0.97); }

  /* Chips stay enabled so you can change your answer */
  .chip.selected {
    background: var(--hh-primary);
    border-color: var(--hh-primary);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(127,86,217,0.25);
  }

  /* De-emphasize past chip rows that are already answered */
  .chip-row.answered .chip:not(.selected) {
    opacity: 0.45;
    border-color: var(--hh-border-light);
  }

  .chip-row.answered .chip:not(.selected):hover {
    opacity: 1;
    background: var(--hh-primary-tint);
    border-color: var(--hh-primary-tint-2);
    color: var(--hh-primary);
  }

  /* Typing indicator while AI "thinks" */
  .chat-typing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 2px;
  }

  .chat-typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--hh-text-muted);
    animation: typing-bounce 1.2s infinite;
  }

  .chat-typing span:nth-child(2) { animation-delay: 0.15s; }
  .chat-typing span:nth-child(3) { animation-delay: 0.30s; }

  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0);   opacity: 0.5; }
    30%           { transform: translateY(-4px); opacity: 1;   }
  }

  /* ─────────────────────────────────────────────────────────
     PLAN SUMMARY CARD (replaces full inline plan in thread)
     ───────────────────────────────────────────────────────── */

  .plan-summary-card {
    background: var(--gc-navy);
    border-radius: var(--r-xl);
    overflow: hidden;
    box-shadow: var(--shadow-navy);
    animation: msg-fade-in 0.35s both cubic-bezier(0.22, 0.61, 0.36, 1);
    margin: 2px 0 4px;
  }

  .plan-summary-inner {
    padding: 16px 16px 14px;
  }

  .plan-summary-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,255,255,0.52);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 7px;
  }

  .plan-summary-check {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(110,231,183,0.2);
    border: 1.5px solid rgba(110,231,183,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .plan-summary-check svg { width: 8px; height: 8px; color: #6ee7b7; }

  .plan-summary-title {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.015em;
    margin-bottom: 8px;
  }

  .plan-summary-focus {
    font-size: 12.5px;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
  }

  .plan-summary-drills {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .plan-summary-drill-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.75);
    font-weight: 500;
  }

  .plan-summary-drill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .plan-summary-drill-dot.phase-skating  { background: var(--phase-skating); }
  .plan-summary-drill-dot.phase-shot     { background: var(--phase-shot); }
  .plan-summary-drill-dot.phase-skill    { background: var(--phase-skill); }
  .plan-summary-drill-dot.phase-compete  { background: var(--phase-compete); }

  .plan-summary-more {
    font-size: 11.5px;
    color: rgba(255,255,255,0.38);
    font-weight: 500;
    padding-left: 15px;
  }

  .plan-summary-stats {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .plan-summary-stat {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
  }

  .plan-summary-sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    flex-shrink: 0;
  }

  .plan-summary-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: rgba(255,255,255,0.10);
    color: #fff;
    border: none;
    border-top: 1px solid rgba(255,255,255,0.10);
    padding: 15px 16px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: background 0.15s ease;
    text-align: center;
  }

  .plan-summary-cta:hover  { background: rgba(255,255,255,0.16); }
  .plan-summary-cta:active { background: rgba(255,255,255,0.07); }
  .plan-summary-cta svg    { width: 16px; height: 16px; flex-shrink: 0; }

  /* ─────────────────────────────────────────────────────────
     INLINE PLAN RENDERING (the chat thread becomes the plan)
     ───────────────────────────────────────────────────────── */

  /* Session brief — navy hero inside the thread */
  .plan-brief {
    background: var(--gc-navy);
    color: #fff;
    border-radius: var(--r-lg);
    padding: 14px 14px 12px;
    margin: 6px 0 4px;
    box-shadow: var(--shadow-navy);
    animation: msg-fade-in 0.32s both cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .plan-brief-eyebrow {
    font-size: 9.5px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 4px;
  }

  .plan-brief-title {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }

  .plan-brief-notes {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    margin-bottom: 11px;
  }

  .plan-brief-note-label {
    font-size: 9px;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 3px;
  }

  .plan-brief-note p {
    font-size: 12.5px;
    color: rgba(255,255,255,0.78);
    line-height: 1.5;
  }

  .plan-brief-stats {
    display: flex;
    gap: 6px;
  }

  .plan-brief-stat {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border-radius: 9px;
    padding: 7px 4px;
    text-align: center;
    line-height: 1.1;
  }

  .plan-brief-stat-label {
    font-size: 9px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }

  .plan-brief-stat-value {
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
  }

  /* Phase divider */
  .plan-phase {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 4px 4px;
    animation: msg-fade-in 0.28s both;
  }

  .plan-phase-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .plan-phase-dot.phase-skating  { background: var(--phase-skating); }
  .plan-phase-dot.phase-shot     { background: var(--phase-shot); }
  .plan-phase-dot.phase-skill    { background: var(--phase-skill); }
  .plan-phase-dot.phase-compete  { background: var(--phase-compete); }

  .plan-phase-name {
    flex: 1;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--hh-text-primary);
    letter-spacing: -0.005em;
  }

  .plan-phase-time {
    font-size: 11px;
    font-weight: 500;
    color: var(--hh-text-tertiary);
  }

  /* Drill card (compact in-thread variant) */
  .plan-drill {
    background: var(--hh-bg-surface);
    border: 1px solid var(--hh-border-light);
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
    animation: msg-fade-in 0.30s both cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .plan-drill-video {
    position: relative;
    background: #111;
    width: 100%;
    aspect-ratio: 16 / 9;
  }

  .plan-drill-video video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .plan-drill-step {
    position: absolute;
    top: 9px;
    left: 10px;
    background: rgba(0,0,0,0.55);
    color: rgba(255,255,255,0.88);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .plan-drill-phase {
    position: absolute;
    top: 9px;
    right: 10px;
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .plan-drill-phase.phase-skating { background: rgba(24,166,200,0.92); }
  .plan-drill-phase.phase-shot    { background: rgba(224,92,42,0.92); }
  .plan-drill-phase.phase-skill   { background: rgba(55,138,221,0.92); }
  .plan-drill-phase.phase-compete { background: rgba(23,160,100,0.92); }

  .plan-drill-shots {
    position: absolute;
    bottom: 9px;
    right: 10px;
    background: rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.95);
    font-size: 10.5px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  .plan-drill-body { padding: 12px 14px 13px; }

  .plan-drill-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--hh-text-primary);
    line-height: 1.25;
    letter-spacing: -0.005em;
    margin-bottom: 4px;
  }

  .plan-drill-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--hh-text-tertiary);
    margin-bottom: 9px;
  }

  .plan-drill-meta-dot {
    width: 2.5px;
    height: 2.5px;
    border-radius: 50%;
    background: var(--hh-text-muted);
  }

  .plan-drill-cues {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .plan-drill-cue {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12.5px;
    color: var(--hh-text-primary);
    line-height: 1.4;
  }

  .plan-drill-cue-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }

  .plan-drill-cue-dot.phase-skating { background: var(--phase-skating); }
  .plan-drill-cue-dot.phase-shot    { background: var(--phase-shot); }
  .plan-drill-cue-dot.phase-skill   { background: var(--phase-skill); }
  .plan-drill-cue-dot.phase-compete { background: var(--phase-compete); }

  /* "Start session" primary CTA at the end of the plan */
  .plan-start-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    background: var(--gc-navy);
    color: #fff;
    border: none;
    padding: 14px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.005em;
    border-radius: var(--r-lg);
    cursor: pointer;
    margin: 10px 0 6px;
    box-shadow: var(--shadow-navy);
    transition: background 0.15s ease, transform 0.12s ease;
    animation: msg-fade-in 0.32s both;
  }

  .plan-start-cta:hover  { background: var(--gc-navy-2); }
  .plan-start-cta:active { transform: scale(0.99); }
  .plan-start-cta svg    { width: 16px; height: 16px; }

  /* Inline "what would you like to change?" hint */
  .plan-refine-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--hh-text-tertiary);
    padding: 4px 0 8px;
    animation: msg-fade-in 0.32s both;
  }

  .plan-refine-hint svg {
    width: 12px;
    height: 12px;
    color: var(--hh-text-muted);
  }

  /* Header: save (bookmark) button */
  .chat-sheet-save {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: transparent;
    color: var(--hh-text-secondary);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .chat-sheet-save:hover { background: var(--hh-bg-tertiary); }
  .chat-sheet-save svg   { width: 17px; height: 17px; }

  .chat-sheet-save.saved {
    color: var(--hh-primary);
  }

  .chat-sheet-save.saved svg {
    fill: var(--hh-primary);
  }

  /* Save toast — short confirmation when bookmark tapped */
  .save-toast {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--hh-text-primary);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
    z-index: 5;
  }

  .save-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Hide the save button until a plan has been generated */
  .chat-sheet-save { display: none; }
  .chat-sheet.plan-mode .chat-sheet-save { display: flex; }

  /* Footer: free-text input + send */
  .chat-input-bar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--hh-bg-surface);
    border-top: 1px solid var(--hh-border-light);
    flex-shrink: 0;
  }

  .chat-input {
    flex: 1;
    appearance: none;
    border: 1px solid var(--hh-border-default);
    background: var(--hh-bg-page);
    border-radius: 18px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--hh-text-primary);
    line-height: 1.4;
    resize: none;
    min-height: 36px;
    max-height: 120px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .chat-input::placeholder { color: var(--hh-text-muted); }

  .chat-input:focus {
    outline: none;
    background: var(--hh-bg-surface);
    border-color: var(--hh-primary-tint-2);
  }

  .chat-input:disabled {
    background: var(--hh-bg-tertiary);
    color: var(--hh-text-muted);
    cursor: not-allowed;
  }

  .chat-send {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--hh-primary);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .chat-send:hover { background: var(--hh-primary-hover); }
  .chat-send:active { transform: scale(0.94); }

  .chat-send:disabled {
    background: var(--hh-border-default);
    cursor: not-allowed;
    transform: none;
  }

  .chat-send svg { width: 16px; height: 16px; }

  /* In plan-mode: hide the textarea input bar, show adjust bar instead */
  .chat-sheet.plan-mode .chat-input-bar  { display: none; }
  .chat-sheet.plan-mode .chat-adjust-bar { display: flex; }

  /* ── Adjust bar (session setup pills) ── */
  .chat-adjust-bar {
    display: none; /* toggled by plan-mode class */
    flex-direction: column;
    gap: 9px;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    background: var(--hh-bg-surface);
    border-top: 1px solid var(--hh-border-light);
    flex-shrink: 0;
  }

  .adjust-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--hh-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .adjust-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .adjust-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 11px;
    background: var(--hh-bg-page);
    border: 1.5px solid var(--hh-border-default);
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--hh-text-secondary);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  .adjust-pill:hover {
    background: var(--hh-primary-tint);
    border-color: var(--hh-primary-tint-2);
    color: var(--hh-primary);
  }

  .adjust-pill svg {
    width: 11px;
    height: 11px;
    opacity: 0.55;
  }

  /* Flash animation when scrolling back to a chip row */
  @keyframes chip-row-flash {
    0%   { opacity: 1; }
    25%  { opacity: 0.35; }
    55%  { opacity: 1; }
    75%  { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .chip-row.flash { animation: chip-row-flash 0.55s ease; }

  /* Body scroll lock helper class (applied via JS) */
  body.sheet-open { overflow: hidden; }

  /* Subtle bottom-of-page divider */
  .page-end-spacer { height: 8px; }

  /* ─── Calendar loading / empty / connect states ─── */
  .cal-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 16px;
    color: var(--hh-text-tertiary);
    font-size: 14px;
  }
  .cal-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--hh-border);
    border-top-color: var(--hh-primary);
    border-radius: 50%;
    animation: cal-spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes cal-spin { to { transform: rotate(360deg); } }

  .cal-empty {
    padding: 20px 16px;
    color: var(--hh-text-tertiary);
    font-size: 14px;
    font-style: italic;
  }

  .cal-connect-wrap {
    padding: 16px;
  }
  .cal-connect-card {
    background: var(--hh-surface);
    border: 1px dashed var(--hh-border);
    border-radius: 12px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }
  .cal-connect-card p {
    margin: 0;
    font-size: 13px;
    color: var(--hh-text-secondary);
    line-height: 1.5;
  }
  .cal-connect-btn {
    margin-top: 4px;
    padding: 10px 20px;
    background: var(--hh-primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cal-connect-btn:hover { background: var(--hh-primary-hover); }
  .cal-connect-icon {
    width: 36px;
    height: 36px;
    background: var(--hh-primary-tint);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-connect-icon svg { width: 20px; height: 20px; color: var(--hh-primary); }

  /* Status-bar safe spacing for fullscreen apps */
  @supports (padding-top: env(safe-area-inset-top)) {
    .top-header { padding-top: env(safe-area-inset-top); }
  }
</style>

<script>
/* ──────────────────────────────────────────────────────────────
   Chat sheet — quick-tap intake → placeholder plan
   ────────────────────────────────────────────────────────────── */
(() => {
  const sheet   = document.getElementById('chatSheet');
  const thread  = document.getElementById('chatThread');
  const subEl   = document.getElementById('chatSheetSub');
  const input   = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSend');

  // Intake question definitions — order matters
  const STEPS = [
    {
      id: 'goalies',
      q: 'How many goalies?',
      options: [
        { value: 1, label: '1' },
        { value: 2, label: '2' },
        { value: 3, label: '3' },
        { value: '4+', label: '4+' },
      ],
    },
    {
      id: 'shooters',
      q: 'How many shooters?',
      options: [
        { value: 1, label: '1' },
        { value: 2, label: '2' },
        { value: 3, label: '3' },
        { value: '4+', label: '4+' },
      ],
    },
    {
      id: 'level',
      q: 'Goalie level?',
      options: [
        { value: 'beginner',     label: 'Beginner' },
        { value: 'intermediate', label: 'Intermediate' },
        { value: 'advanced',     label: 'Advanced' },
      ],
    },
    {
      id: 'duration',
      q: 'Lesson length?',
      options: [
        { value: 30, label: '30 min' },
        { value: 45, label: '45 min' },
        { value: 60, label: '60 min' },
        { value: 90, label: '90 min' },
      ],
    },
    {
      id: 'screener',
      q: 'Screener available — a board or a player to screen in front of the goalie?',
      options: [
        { value: 'yes',     label: 'Yes' },
        { value: 'no',      label: 'No' },
        { value: 'skip',    label: 'Skip screens' },
      ],
    },
    {
      id: 'focus',
      q: 'What should we focus on?',
      options: [
        { value: 'crease_movement',    label: 'Crease movement' },
        { value: 'positioning_angles', label: 'Positioning & angles' },
        { value: 'save_technique',     label: 'Save technique' },
        { value: 'rebound_control',    label: 'Rebound control' },
        { value: 'post_play',          label: 'RVH & post play' },
        { value: 'compete',            label: 'Compete' },
        { value: 'surprise_me',        label: 'Surprise me' },
      ],
    },
  ];

  // Session state for this intake
  let state = { answers: {}, stepIdx: 0, context: null };

  /* ── DOM helpers ───────────────────────────────────────── */
  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls)  n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      thread.scrollTop = thread.scrollHeight;
    });
  }

  /* ── Renderers ─────────────────────────────────────────── */
  function renderContextStrip(ctx) {
    if (!ctx || !ctx.goalie) return;

    const TONES = ['tone-a', 'tone-b', 'tone-c', 'tone-d'];
    const names = ctx.goalie.split(/\s*&\s*/).map(n => n.trim()).filter(Boolean);

    function initials(name) {
      const p = name.split(/\s+/);
      return p.length === 1 ? p[0].slice(0,2).toUpperCase() : (p[0][0] + p[p.length-1][0]).toUpperCase();
    }
    function tone(name) {
      return TONES[((name || '').toUpperCase().charCodeAt(0) || 65) % 4];
    }

    const avatarsHtml = names.map(n =>
      `<div class="ctx-avatar goalie-avatar ${tone(n)}">${initials(n)}</div>`
    ).join('');

    const strip = el('div', 'chat-context-strip');
    strip.innerHTML = `
      <div class="ctx-avatars">${avatarsHtml}</div>
      <div class="chat-context-text">
        <strong>${ctx.goalie}</strong>
        <span> · ${ctx.time}</span>
      </div>
    `;
    thread.appendChild(strip);
  }

  /* Intake question — label style (no bubble background) */
  function renderAssistantMsg(text, asBubble = false) {
    const wrap = el('div', asBubble ? 'chat-msg assistant has-bubble' : 'chat-msg assistant');
    wrap.innerHTML = `
      <div class="chat-msg-avatar"><svg class="lucide"><use href="#i-sparkles"/></svg></div>
      <div class="chat-msg-bubble">${text}</div>
    `;
    thread.appendChild(wrap);
    scrollToBottom();
  }

  /* User free-text replies (only used after plan is generated) */
  function renderUserMsg(text) {
    const wrap = el('div', 'chat-msg user');
    wrap.innerHTML = `<div class="chat-msg-bubble">${text}</div>`;
    thread.appendChild(wrap);
    scrollToBottom();
  }

  function renderChips(step) {
    const row = el('div', 'chip-row');
    row.dataset.stepId = step.id;
    step.options.forEach(opt => {
      const btn = el('button', 'chip', opt.label);
      btn.type = 'button';
      btn.dataset.value = opt.value;
      btn.addEventListener('click', () => onChipTap(step, opt, btn, row));
      row.appendChild(btn);
    });
    thread.appendChild(row);

  }

  function renderTyping() {
    const wrap = el('div', 'chat-msg assistant has-bubble');
    wrap.id = 'chatTyping';
    wrap.innerHTML = `
      <div class="chat-msg-avatar"><svg class="lucide"><use href="#i-sparkles"/></svg></div>
      <div class="chat-msg-bubble"><span class="chat-typing"><span></span><span></span><span></span></span></div>
    `;
    thread.appendChild(wrap);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('chatTyping');
    if (t) t.remove();
  }

  function cap(s) {
    if (!s) return '';
    return s[0].toUpperCase() + s.slice(1);
  }

  /* ────── Sample plan content (would come from Claude API in production) ──────
     The build prompt's drill-library schema lets a server-side AI assemble these
     from drills/*.json + assembly rules. For now we hardcode the 6-drill plan
     used in lesson_plan_preview_crease_positioning.html so the UX flow is real. */
  /* ── Edge Function ──────────────────────────────────────────────────── */
  const EDGE_FUNCTION_URL = 'https://whawnvlctxrfzkyvivca.supabase.co/functions/v1/generate-plan';

  async function callGeneratePlan(answers, ctx) {
    const params = {
      goalies:  Number(answers.goalies)  || 1,
      shooters: Number(answers.shooters) || 0,
      level:    answers.level            || 'intermediate',
      duration: Number(answers.duration) || 45,
      screener: answers.screener         || 'skip',
      focus:    answers.focus            || 'surprise_me',
      goalie:   ctx?.goalie              || undefined,
    };
    const allDrills = (window.filterDrills ? window.filterDrills(params) : window.DRILL_LIBRARY) || [];
    if (!allDrills.length) throw new Error('No drills matched these session settings');

    // Shuffle within each session slot so the AI sees different candidates
    // each call — prevents it always anchoring on the same "top" drills.
    function shuffleSlot(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    const bySlot = {};
    allDrills.forEach(d => {
      const slot = d.session_slot || 'other';
      (bySlot[slot] = bySlot[slot] || []).push(d);
    });
    Object.values(bySlot).forEach(shuffleSlot);
    const drills = Object.values(bySlot).flat();

    const resp = await fetch(EDGE_FUNCTION_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ params, drills }),
    });

    if (!resp.ok) {
      let msg = `Server error (${resp.status})`;
      try { const e = await resp.json(); if (e.error) msg = e.error; } catch {}
      throw new Error(msg);
    }

    const data = await resp.json();
    if (!data.plan) throw new Error('No plan returned from server');
    return data.plan;
  }

  /* ── SAMPLE_PLAN fallback — used only for offline dev ─────────────── */
  const SAMPLE_PLAN = {
    title: 'Crease Movement & Positioning',

    },
    sections: [

            clip: 'drill-clips/butterfly-shot-warmup.mp4',

          },

          },
          {

            clip: 'drill-clips/lateral-release-rvh-bump-out-slot.mp4',

  function renderInlinePlan(plan, answers, ctx) {
    const totalDrills = plan.sections.reduce((n, s) => n + s.drills.length, 0);

    // Build a flat list of all drills with their phase for preview dots
    const allDrills = plan.sections.flatMap(s =>
      s.drills.map(d => ({ ...d, phase: s.phase }))
    );
    const previewDrills = allDrills.slice(0, 3);
    const remaining = totalDrills - previewDrills.length;

    // Focus blurb — trim to one sentence so it fits nicely
    const focusBlurb = plan.notes.focus.split(/[.!?]/)[0].trim();

    // Build summary card
    const card = el('div', 'plan-summary-card');
    card.innerHTML = `
      <div class="plan-summary-inner">
        <div class="plan-summary-eyebrow">
          <span class="plan-summary-check">
            <svg class="lucide"><use href="#i-check"/></svg>
          </span>
          Plan ready · ${answers.duration} min
        </div>
        <div class="plan-summary-title">${plan.title}</div>
        <div class="plan-summary-focus">${focusBlurb}.</div>
        <div class="plan-summary-drills">
          ${previewDrills.map(d => `
            <div class="plan-summary-drill-row">
              <span class="plan-summary-drill-dot phase-${d.phase}"></span>
              <span>${d.name}</span>
            </div>
          `).join('')}
          ${remaining > 0 ? `<div class="plan-summary-more">+${remaining} more drills</div>` : ''}
        </div>
        <div class="plan-summary-stats">
          <span class="plan-summary-stat">${totalDrills} drills</span>
          <span class="plan-summary-sep"></span>
          <span class="plan-summary-stat">${answers.duration} min</span>
          <span class="plan-summary-sep"></span>
          <span class="plan-summary-stat">${cap(answers.level)}</span>
          ${answers.screener === 'yes' ? `<span class="plan-summary-sep"></span><span class="plan-summary-stat">Screener</span>` : ''}
        </div>
      </div>
      <button class="plan-summary-cta" type="button">
        View &amp; Edit Lesson Plan
        <svg class="lucide"><use href="#i-arrow-right"/></svg>
      </button>
    `;

    // Wire the CTA — pass session params so the lesson plan page can filter swap options
    card.querySelector('.plan-summary-cta').addEventListener('click', () => {
      const p = new URLSearchParams({
        shooters:  state.answers.shooters         ?? '',
        goalies:   state.answers.goalies          ?? '',
        screener:  state.answers.screener         ?? '',
        level:     state.answers.level            ?? '',
        focus:     state.answers.focus            ?? '',
        duration:  state.answers.duration         ?? '',
        goalie:    state.context?.goalie          ?? '',
        goalieId:  state.context?.goalieId        ?? '',
        sessionId: state.context?.sessionId       ?? '',
      });
      window.location.href = `lesson_plan_preview_crease_positioning.html?${p.toString()}`;
    });

    thread.appendChild(card);

    // Follow-up nudge
    const hint = el('div', 'plan-refine-hint');
    hint.innerHTML = `<svg class="lucide"><use href="#i-pencil"/></svg>Want to swap a drill or change the focus? Just type below.`;
    thread.appendChild(hint);

    scrollToBottom();
  }

  /* ── Flow control ──────────────────────────────────────── */
  function askStep(idx) {
    const step = STEPS[idx];
    if (!step) {
      finishIntake();
      return;
    }
    setTimeout(() => {
      renderAssistantMsg(step.q);
      setTimeout(() => renderChips(step), 140);
    }, 220);
  }

  function onChipTap(step, opt, btnEl, rowEl) {
    const wasAnswered    = !!state.answers[step.id];
    const valueChanged   = state.answers[step.id] !== opt.value;

    // Swap selection highlight
    rowEl.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    btnEl.classList.add('selected');
    rowEl.classList.add('answered');

    state.answers[step.id] = opt.value;

    if (!wasAnswered) {
      // Fresh — advance to next step
      state.stepIdx += 1;
      askStep(state.stepIdx);
    } else if (valueChanged && sheet.classList.contains('plan-mode')) {
      // Changed an existing answer while viewing the plan — regenerate
      regeneratePlan();
    }
  }

  function finishIntake() {
    setTimeout(async () => {
      renderAssistantMsg("Building your plan…", true);
      renderTyping();
      try {
        const plan = await callGeneratePlan(state.answers, state.context);
        // Cache for lesson plan preview page to read
        try { localStorage.setItem('hh_pending_plan', JSON.stringify(plan)); } catch {}
        removeTyping();
        renderInlinePlan(plan, state.answers, state.context);
        switchToPlanMode();
        enableFreeChat();
      } catch (err) {
        console.error('[finishIntake] Error:', err);
        removeTyping();
        renderAssistantMsg(
          `Couldn't build the plan: ${err.message}. Check your connection and try again.`,
          true
        );
      }
    }, 200);
  }

  /* ── Adjust bar label map ──────────────────────────────── */
  const PILL_LABELS = {
    goalies:  v => `${v} ${v == 1 ? 'goalie' : 'goalies'}`,
    shooters: v => `${v} ${v == 1 ? 'shooter' : 'shooters'}`,
    level:    v => ({ beginner: 'Beginner', intermediate: 'Intermediate', advanced: 'Advanced' }[v] || v),
    duration: v => `${v} min`,
    screener: v => ({ yes: 'Screener ✓', no: 'No screener', skip: 'Skip screens' }[v] || v),
    focus:    v => ({
      crease_movement: 'Crease movement', positioning_angles: 'Positioning & angles',
      save_technique: 'Save technique', rebound_control: 'Rebound control',
      post_play: 'RVH & post play', compete: 'Compete', surprise_me: 'Surprise me',
    }[v] || v),
  };

  function renderAdjustPills() {
    const container = document.getElementById('adjustPills');
    container.innerHTML = '';
    STEPS.forEach(step => {
      const val = state.answers[step.id];
      if (val == null) return;
      const fmt = PILL_LABELS[step.id];
      const label = fmt ? fmt(val) : String(val);
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'adjust-pill';
      pill.innerHTML = `<span>${label}</span><svg class="lucide"><use href="#i-pencil"/></svg>`;
      pill.setAttribute('aria-label', `Change: ${step.q}`);
      pill.addEventListener('click', () => scrollToStep(step.id));
      container.appendChild(pill);
    });
  }

  function scrollToStep(stepId) {
    const row = thread.querySelector(`[data-step-id="${stepId}"]`);
    if (!row) return;
    row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    // Double rAF ensures the scroll settles before the flash plays
    requestAnimationFrame(() => requestAnimationFrame(() => {
      row.classList.remove('flash');
      row.classList.add('flash');
      row.addEventListener('animationend', () => row.classList.remove('flash'), { once: true });
    }));
  }

  function regeneratePlan() {
    // Remove old plan card + refine hint
    thread.querySelectorAll('.plan-summary-card, .plan-refine-hint').forEach(n => n.remove());
    renderAdjustPills();
    renderAssistantMsg('Got it — rebuilding your plan…', true);
    renderTyping();
    callGeneratePlan(state.answers, state.context)
      .then(plan => {
        try { localStorage.setItem('hh_pending_plan', JSON.stringify(plan)); } catch {}
        removeTyping();
        renderInlinePlan(plan, state.answers, state.context);
        scrollToBottom();
      })
      .catch(err => {
        console.error('[regeneratePlan] Error:', err);
        removeTyping();
        renderAssistantMsg(`Couldn't rebuild the plan: ${err.message}`, true);
      });
  }

  function switchToPlanMode() {
    sheet.classList.add('plan-mode');
    document.getElementById('chatSheetTitle').textContent = 'Lesson plan';
    renderAdjustPills();
  }

  function enableFreeChat() {
    input.disabled = false;
    sendBtn.disabled = false;
    input.placeholder = "Tweak the plan — e.g. swap drill 3, make it harder…";
  }

  /* ── Open / close ──────────────────────────────────────── */
  function openSheet(context) {
    // Reset state + thread + mode
    state = { answers: {}, stepIdx: 0, context };
    thread.innerHTML = '';
    input.disabled = true;
    sendBtn.disabled = true;
    input.value = '';
    input.placeholder = "Tap an option above to start";
    sheet.classList.remove('plan-mode');
    document.getElementById('chatSheetTitle').textContent = 'Build a lesson plan';
    document.getElementById('chatSheetSave').classList.remove('saved');

    // Header subtitle
    if (context?.goalie) {
      subEl.textContent = `For ${context.goalie} · ${context.time}`;
    } else {
      subEl.textContent = "A few quick questions, then I'll draft it.";
    }

    // Optional context strip + opening message
    renderContextStrip(context);
    setTimeout(() => {
      // Strip trailing punctuation so names like "Lily P." don't produce ".."
      const name = context?.goalie?.replace(/[.,;:]+$/, '');
      const opener = name
        ? `Building a plan for ${name} — a few quick questions:`
        : `A few quick questions and I'll draft a session:`;
      renderAssistantMsg(opener);
      askStep(0);
    }, 280);

    // Show sheet
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.classList.add('sheet-open');
  }

  function closeSheet() {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('sheet-open');
  }

  /* ── Helpers for saved-plan state ─────────────────────── */
  function applySavedPlanState(btn) {
    // Primary: check DB (session has a linked saved plan)
    const sessionId = btn.dataset.sessionId;
    let planPage = null;
    if (sessionId && window.DB && DB.hasSavedPlan(sessionId)) {
      planPage = 'lesson_plan_preview_crease_positioning.html';
    }
    // Legacy fallback: old localStorage key written before DB existed
    if (!planPage) {
      const legacyKey = 'savedPlan_' + (btn.dataset.goalie || 'default').replace(/[^a-zA-Z0-9]/g, '_');
      planPage = localStorage.getItem(legacyKey);
    }
    if (!planPage) return;
    btn.dataset.seePlan = planPage;
    // Swap icon href
    const useEl = btn.querySelector('use');
    if (useEl) useEl.setAttribute('href', '#i-arrow-right');
    // Swap button label text ("Build plan" → "See plan")
    for (const node of btn.childNodes) {
      if (node.nodeType === Node.TEXT_NODE && node.textContent.includes('Build')) {
        node.textContent = node.textContent.replace('Build plan', 'See plan');
        break;
      }
    }
    btn.classList.add('see-plan-mode');
  }

  /* ── Wire up entry points ──────────────────────────────── */
  // Auto-open sheet when returning from lesson plan page via "Rebuild"
  (function checkRebuildParam() {
    const rebuildId = new URLSearchParams(location.search).get('rebuild');
    if (!rebuildId) return;
    history.replaceState({}, '', 'index.html'); // clean the URL
    // Wait a tick so all buttons are wired + saved-plan state applied
    setTimeout(() => {
      const btn = document.querySelector(`[data-session-id="${rebuildId}"][data-build-plan]`);
      if (!btn) return;
      const goalieId = btn.dataset.goalieId;
      const dbGoalie = window.DB && goalieId ? DB.GoalieStore.getById(goalieId) : null;
      openSheet({
        sessionId: btn.dataset.sessionId || null,
        goalieId:  goalieId || null,
        goalie:    btn.dataset.goalie,
        time:      btn.dataset.time,
        count:     btn.dataset.count,
        level:     dbGoalie?.level    || btn.dataset.level,
        duration:  dbGoalie?.default_session_minutes || btn.dataset.duration,
        shooters:  dbGoalie?.default_shooters || btn.dataset.count,
      });
    }, 150);
  })();

  document.querySelectorAll('[data-build-plan]').forEach(btn => {
    // Apply saved-plan state before attaching click (so icon/text is already updated)
    applySavedPlanState(btn);

    btn.addEventListener('click', () => {
      // If this goalie already has a saved plan → navigate directly to it
      if (btn.dataset.seePlan) {
        window.location.href = btn.dataset.seePlan;
        return;
      }

      // Build context — prefer DB profile over hardcoded data attributes
      const goalieId = btn.dataset.goalieId;
      const dbGoalie = window.DB && goalieId ? DB.GoalieStore.getById(goalieId) : null;

      openSheet({
        sessionId: btn.dataset.sessionId || null,
        goalieId:  goalieId || null,
        goalie:    btn.dataset.goalie,
        time:      btn.dataset.time,
        count:     btn.dataset.count,
        // DB profile wins over hardcoded attribute — so level/duration stay
        // current even after the coach edits the goalie's profile
        level:     dbGoalie?.level    || btn.dataset.level,
        duration:  dbGoalie?.default_session_minutes || btn.dataset.duration,
        shooters:  dbGoalie?.default_shooters || btn.dataset.count,
      });
    });
  });

  // Close on backdrop tap, close button, or Escape
  sheet.querySelectorAll('[data-sheet-close]').forEach(el => {
    el.addEventListener('click', closeSheet);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  // Save (bookmark) toggle + persist to DB
  const saveBtn = document.getElementById('chatSheetSave');
  const toast   = document.getElementById('saveToast');
  saveBtn.addEventListener('click', () => {
    const isSaved = saveBtn.classList.toggle('saved');
    toast.textContent = isSaved ? 'Plan saved' : 'Removed from saved';
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 1600);

    if (isSaved && window.DB) {
      // Build a real Plan record from current state and commit it
      const plan = DB.PlanStore.save({
        session_id:         state.context?.sessionId || null,
        goalie_ids:         state.context?.goalieId ? [state.context.goalieId] : [],
        title:              'Crease Movement & Positioning', // TODO: from AI response
        focus_areas:        state.answers.focus ? [state.answers.focus] : [],
        duration_minutes:   Number(state.answers.duration) || 60,
        level:              state.answers.level || 'intermediate',
        shooter_count:      Number(state.answers.shooters) || 1,
        screener_available: state.answers.screener === 'yes',
        status:             'saved',
        ai_brief:           '',
        sections:           [],   // TODO: populated from AI response
      });
      // Link plan to session and record drill usage
      DB.commitPlan(plan.id, state.context?.sessionId || null);
      // Store the plan page reference so "See plan" works on reload
      saveBtn.dataset.planId = plan.id;
    }
  });

  // Send button — placeholder behavior for refinement turns
  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;
    renderUserMsg(text);
    input.value = '';
    renderTyping();
    setTimeout(() => {
      removeTyping();
      renderAssistantMsg("Got it — I'll adjust that. (Wire to Claude API next.)", true);
    }, 900);
  });

  // Enter to send (Shift+Enter for newline)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !input.disabled) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  // Auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Expose openSheet globally so calendar-injected cards can trigger it
  window._hhOpenSheet = openSheet;
})();
</script>

  function saveToken(tokenResp) {
